<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="シンプルでスマホ対応のホームページ">
  <title>My Homepage</title>
  <style>
    :root { --bg:#f5f7fb; --text:#202938; --muted:#667085; --primary:#4f46e5; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; line-height:1.7; }
    .container { width:min(92%,760px); margin:0 auto; }
    header { padding:72px 0 48px; text-align:center; background:linear-gradient(135deg,#eef2ff,#fff); }
    .avatar { display:grid; place-items:center; width:88px; height:88px; margin:0 auto 20px; border-radius:50%; color:#fff; background:var(--primary); font-size:36px; font-weight:700; }
    h1 { margin:0 0 8px; font-size:clamp(28px,7vw,44px); }
    .lead { margin:0; color:var(--muted); }
    main { padding:32px 0 64px; }
    .card { padding:28px; margin-bottom:20px; border-radius:18px; background:var(--card); box-shadow:0 8px 30px rgba(30,41,59,.08); }
    h2 { margin-top:0; font-size:22px; }
    .links { display:grid; gap:12px; }
    .links a { display:block; padding:14px 18px; border-radius:10px; color:#fff; background:var(--primary); text-align:center; text-decoration:none; transition:opacity .2s; }
    .links a:hover { opacity:.85; }
    footer { padding:24px; color:var(--muted); font-size:14px; text-align:center; }
    @media (max-width:480px) { header { padding:56px 0 36px; } .card { padding:22px; } }
  </style>
</head>
<body>
  <header><div class="container"><div class="avatar">G</div><h1>My Homepage</h1><p class="lead">こんにちは。シンプルなホームページです。</p></div></header>
  <main class="container">
    <section class="card"><h2>プロフィール</h2><p>ここに自己紹介文を入力してください。好きなこと、活動内容、連絡先などを掲載できます。</p></section>
    <section class="card"><h2>リンク</h2><div class="links"><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a><a href="mailto:example@example.com">メールで連絡する</a></div></section>
  </main>
  <footer>© 2026 My Homepage</footer>
</body>
</html>
